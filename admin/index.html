<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio Studio</title><style>
:root{color-scheme:dark;--bg:#0b1017;--surface:#111923;--line:#263341;--ink:#f2f5f9;--muted:#a6b4c4;--accent:#86e2cd;--mono:ui-monospace,SFMono-Regular,Consolas,monospace}*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:100px}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}a:hover{color:var(--accent)}a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:5px}.shell{max-width:1160px;margin:auto;padding:0 36px}.skip{position:absolute;left:-9999px}.skip:focus{left:12px;top:12px;background:var(--surface);padding:12px;z-index:10}header{position:sticky;top:0;background:#0b1017ed;backdrop-filter:blur(14px);z-index:5;border-bottom:1px solid var(--line)}nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:24px}.brand{font-weight:750;letter-spacing:-.04em;font-size:19px}.brand span{color:var(--accent)}.navlinks{display:flex;gap:25px;align-items:center;font-size:13px;color:var(--muted)}.navlinks a:last-child{border:1px solid var(--line);padding:8px 14px;border-radius:6px;color:var(--ink)}.hero{padding:95px 0 72px;display:grid;grid-template-columns:1.4fr 1fr;gap:65px;align-items:center}.label{font:600 11px/1.6 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(43px,6.2vw,79px);letter-spacing:-.07em;line-height:1.01;margin:22px 0}h1 span{display:block;color:var(--muted);font-size:.54em;letter-spacing:-.045em;margin-top:16px;line-height:1.15}h2{font-size:clamp(29px,4vw,43px);line-height:1.15;letter-spacing:-.045em;margin:12px 0 18px}h3{font-size:21px;letter-spacing:-.025em;line-height:1.3;margin:0 0 10px}p{color:var(--muted);margin:0 0 16px}.lead{font-size:19px;max-width:680px;line-height:1.7}.buttons{display:flex;flex-wrap:wrap;gap:12px;margin-top:27px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:7px;padding:11px 17px;font-size:14px;font-weight:650}.primary{background:var(--accent);color:#0b201c;border-color:var(--accent)}.primary:hover{background:#b0f4e5;color:#0b201c}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px}.profiletop{display:flex;gap:16px;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line)}.avatar{width:60px;height:60px;border:1px solid #42645f;background:#182f31;color:var(--accent);border-radius:12px;display:grid;place-items:center;font:700 23px var(--mono)}.profiletop strong{display:block;font-size:19px}.profiletop p{margin:0;font-size:13px}.fact{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-bottom:1px solid var(--line);font-size:13px}.fact span{color:var(--muted)}.fact strong{text-align:right;font-weight:550}.fact:last-child{border:0;padding-bottom:0}.strip{display:grid;grid-template-columns:repeat(3,1fr);border-block:1px solid var(--line);margin-bottom:24px}.strip div{padding:23px 18px;border-right:1px solid var(--line)}.strip div:first-child{padding-left:0}.strip div:last-child{border:0}.strip strong{display:block;font-size:25px;letter-spacing:-.04em}.strip span{font-size:13px;color:var(--muted)}section{padding:64px 0;border-bottom:1px solid var(--line)}.sectionhead{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:end;margin-bottom:24px}.sectionhead p{margin:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:9px}.card p{font-size:14px}.card .label{margin-bottom:4px}.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:3px 8px;margin:3px 3px 3px 0;color:#c3d3e4;font:11px/1.5 var(--mono)}.job{display:grid;grid-template-columns:250px 1fr;gap:30px;padding:30px 0;border-top:1px solid var(--line)}.job p{font-size:15px}.job ul{padding-left:20px;margin:0 0 12px;color:var(--muted);font-size:15px}.job li{margin-bottom:7px}.case{display:grid;grid-template-columns:1fr 1.1fr;gap:28px;padding:28px;background:var(--surface);border:1px solid var(--line);border-radius:12px;margin:15px 0}.case p{font-size:15px}.flow{display:flex;flex-direction:column;gap:8px;justify-content:center}.node{border:1px solid var(--line);background:var(--bg);padding:10px 13px;border-radius:6px;font:12px/1.6 var(--mono);color:#cbd8e6}.arrow{color:var(--accent);font:14px var(--mono);text-align:center}.note{font-size:12px;color:var(--muted)}.publiclink{display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line);padding:14px 0;font-size:14px}.publiclink span{color:var(--accent)}.contact{display:flex;justify-content:space-between;align-items:center;gap:30px;flex-wrap:wrap}footer{padding:28px 0;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:15px;flex-wrap:wrap}@media(max-width:780px){.shell{padding:0 22px}nav{flex-wrap:wrap;padding:16px 0;gap:12px}.navlinks{gap:13px;flex-wrap:wrap}.hero{grid-template-columns:1fr;padding:58px 0 42px;gap:30px}.sectionhead,.job,.case{grid-template-columns:1fr;gap:16px}.grid{grid-template-columns:1fr}section{padding:43px 0}.strip strong{font-size:20px}.strip div{padding:15px 10px}.strip span{font-size:11px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.filters button{font:inherit;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 13px;cursor:pointer}.filters button.active{background:var(--accent);color:#0b201c;border-color:var(--accent)}</style><style>main{padding-block:35px!important}label{display:block;margin:12px 0;color:var(--muted);font-size:13px}input,textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:5px}textarea{min-height:85px}button{cursor:pointer;font:inherit;color:var(--ink);background:var(--surface)}.editor{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}.editor .panel{margin:14px 0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button[aria-pressed=true]{background:var(--accent);color:#0b201c}.preview{position:sticky;top:100px}.danger{color:#ffb7b7}.status{white-space:pre-wrap}@media(max-width:780px){.editor{grid-template-columns:1fr}.preview{position:static}}</style></head><body><div id="root"><main class="shell"><h1 style="font-size:42px">Portfolio Studio</h1><p id="startup-status" role="status">Starting the editor…</p><p>If the editor does not start, <a href="https://github.com/Gunavikesh/Gunavikesh.github.io/actions">check GitHub Pages deployment</a> or <a href="../">return to the portfolio</a>.</p><noscript>JavaScript must be enabled to use the editor.</noscript></main></div><script>
try {
const repo="Gunavikesh/Gunavikesh.github.io";
const endpoint="https://api.github.com/repos/"+repo+"/contents/data/portfolio.json";
const fields={profile:{name:"Full name",title:"Job title",experience:"Years of experience",focus:"Engineering focus",headline:"Headline",bio:"Professional summary",company:"Current company",location:"Location",primaryStack:"Primary stack",linkedin:"LinkedIn URL",github:"GitHub URL",photo:"Profile image HTTPS URL",resume:"Résumé HTTPS URL"},experience:{company:"Company",role:"Role",period:"Period",details:"Responsibilities (one per line)",stack:"Technologies (one per line)"},projects:{name:"Project name",domain:"Category",summary:"Summary",challenge:"Challenge",approach:"Approach",engineering:"Engineering focus",architecture:"Architecture steps (one per line)",stack:"Technologies (one per line)",link:"Project HTTPS URL"},skills:{name:"Skill category",description:"Description",stack:"Technologies (one per line)"},links:{name:"Repository name",url:"HTTPS URL"}};
const arrays=new Set(["details","stack","architecture"]);
const long=new Set(["bio","summary","challenge","approach","engineering","description",...arrays]);
const root=document.getElementById("root");
let data=null,sha="",tab="profile",busy=false,dirty=false;
function el(tag,attrs={},...children){
 const node=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs)){
  if(k==="className")node.className=v;else if(k==="onClick")node.addEventListener("click",v);else if(k==="onInput")node.addEventListener("input",v);else if(k==="value")node.value=v;else if(k==="disabled")node.disabled=v;else node.setAttribute(k,v);
 }
 for(const c of children.flat())if(c!==null&&c!==undefined)node.append(c instanceof Node?c:document.createTextNode(String(c)));
 return node;
}
const button=(text,fn,cls="btn")=>el("button",{type:"button",className:cls,onClick:fn},text);
const token=el("input",{type:"password",autocomplete:"off",placeholder:"Token is held in memory only","aria-label":"GitHub access token"});
const status=el("p",{className:"status",role:"status","aria-live":"polite"},"Loading portfolio…");
const editor=el("div",{}),preview=el("aside",{className:"panel preview"}),tabs=el("div",{className:"tabs"});
const publishButton=button("Publish changes",publish,"btn primary");
const reloadButton=button("Reload published content",()=>{if(!dirty||confirm("Discard unsaved changes?"))load()});
const exportButton=button("Export draft",()=>{if(!data)return;const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));const a=el("a",{href:url,download:"portfolio.json"});a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
function setBusy(value){busy=value;publishButton.disabled=value||!data;reloadButton.disabled=value;exportButton.disabled=value||!data}
function notify(message){status.textContent=message}
function renderPreview(){
 preview.replaceChildren(el("div",{className:"label"},"Live draft preview"));
 if(!data)return;
 const p=data.profile;
 preview.append(el("h2",{},p.name),el("h3",{},p.title),el("p",{},p.headline),el("p",{},p.bio),el("p",{},p.experience+" · "+p.company));
 if(tab!=="profile")for(const x of data[tab])preview.append(el("div",{className:"card"},el("h3",{},x.name||x.company||"New entry"),el("p",{},x.summary||x.description||x.role||x.url||""),el("p",{},(x.stack||[]).join(" · "))));
}
function render(){
 tabs.replaceChildren();editor.replaceChildren();if(!data){renderPreview();return}
 for(const t of Object.keys(fields)){const b=button(t[0].toUpperCase()+t.slice(1),()=>{tab=t;render()});b.setAttribute("aria-pressed",String(t===tab));tabs.append(b)}
 const entries=tab==="profile"?[data.profile]:data[tab];
 entries.forEach((obj,i)=>{
  const panel=el("div",{className:"panel"});
  for(const [k,title] of Object.entries(fields[tab])){
   const input=el(long.has(k)?"textarea":"input",{value:arrays.has(k)?(obj[k]||[]).join("\n"):obj[k]||"",onInput:e=>{obj[k]=arrays.has(k)?e.target.value.split("\n"):e.target.value;dirty=true;renderPreview()}});
   panel.append(el("label",{},title,input));
  }
  if(tab!=="profile")panel.append(button("Remove entry",()=>{if(confirm("Remove this entry from your draft?")){data[tab].splice(i,1);dirty=true;render()}},"btn danger"));
  editor.append(panel);
 });
 if(tab!=="profile")editor.append(button("+ Add entry",()=>{const obj=Object.fromEntries(Object.keys(fields[tab]).map(k=>[k,arrays.has(k)?[]:""]));if(tab==="projects")obj.id=crypto.randomUUID();data[tab].push(obj);dirty=true;render()}));
 renderPreview();
}
function validate(x){if(!x||!x.profile||!["experience","projects","skills","links"].every(k=>Array.isArray(x[k])))throw Error("Unexpected portfolio data format.");return x}
const decode=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const encode=s=>{let str="";for(const b of new TextEncoder().encode(s))str+=String.fromCharCode(b);return btoa(str)};
async function githubRead(auth=""){const headers={Accept:"application/vnd.github+json"};if(auth)headers.Authorization="Bearer "+auth;const r=await fetch(endpoint,{cache:"no-store",headers});if(!r.ok)throw Error("GitHub returned "+r.status);const x=await r.json();return {data:validate(JSON.parse(decode(x.content))),sha:x.sha}}
async function load(){setBusy(true);notify("Loading…");try{try{const x=await githubRead(token.value.trim());data=x.data;sha=x.sha;notify("Loaded latest published content.")}catch(e){const r=await fetch("../data/portfolio.json",{cache:"no-store"});if(!r.ok)throw Error("Unable to load portfolio data (HTTP "+r.status+").");data=validate(await r.json());sha="";notify("Loaded website data. GitHub API unavailable: "+e.message+". Reload with your token before publishing.")}dirty=false;render()}catch(e){notify(e.message+" Use Reload to try again.")}finally{setBusy(false)}}
async function publish(){if(busy||!data)return;const auth=token.value.trim();if(!auth){notify("Enter your repository-scoped token to publish.");return}if(!sha){notify("Reload published content with your token before editing and publishing. Export your draft first if needed.");return}if(!confirm("Publish these details publicly?"))return;
 setBusy(true);try{const clean=JSON.parse(JSON.stringify(data));for(const key of ["experience","projects","skills"])for(const item of clean[key])for(const k of arrays)if(Array.isArray(item[k]))item[k]=item[k].map(s=>s.trim()).filter(Boolean);
 const r=await fetch(endpoint,{method:"PUT",headers:{Authorization:"Bearer "+auth,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:"Update portfolio via Portfolio Studio",content:encode(JSON.stringify(clean,null,2)+"\n"),sha,branch:"main"})});const x=await r.json();
 if(!r.ok)throw Error(r.status===409||r.status===422?"Conflict or validation error. Export your draft before reloading.":r.status===401||r.status===403?"Token invalid, expired, or missing repository Contents write permission.":x.message||"Publish failed");
 sha=x.content.sha;data=clean;dirty=false;render();notify("Published to GitHub. Public changes appear after GitHub Pages deployment.");
 }catch(e){notify(e.message)}finally{setBusy(false)}}
root.replaceChildren(el("main",{className:"shell"},el("div",{className:"label"},"Authorized publishing workflow"),el("h1",{style:"font-size:42px"},"Portfolio Studio"),el("p",{},"Edit your public profile without touching code. Drafts are local until you publish."),el("a",{className:"btn",href:"../"},"← Public portfolio"),el("div",{className:"panel"},el("label",{},"GitHub fine-grained access token (only this repository; Contents read/write)",token),el("a",{href:"https://github.com/settings/personal-access-tokens/new",target:"_blank",rel:"noopener noreferrer"},"Create a restricted token ↗"),el("div",{className:"buttons"},publishButton,reloadButton,exportButton,button("Clear token",()=>{token.value="";notify("Token cleared.")})),status),tabs,el("div",{className:"editor"},editor,preview)));
load();
window.addEventListener("beforeunload",e=>{if(dirty){e.preventDefault();e.returnValue=""}});

} catch (error) {
 const status = document.getElementById("startup-status");
 if(status) status.textContent = "Editor failed to start: " + error.message;
 else {const p=document.createElement("p");p.textContent="Editor startup error: "+error.message;document.getElementById("root").append(p);}
}
</script></body></html>
