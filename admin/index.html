<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Portfolio Studio</title><link rel="stylesheet" href="../assets/styles.css"><style>main{padding-block:35px!important}label{display:block;margin:12px 0;color:var(--muted);font-size:13px}input,textarea{display:block;width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;margin-top:5px}textarea{min-height:85px}button{cursor:pointer;font:inherit;color:var(--ink);background:var(--surface)}.editor{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}.editor .panel{margin:14px 0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button[aria-pressed=true]{background:var(--accent);color:#0b201c}.preview{position:sticky;top:100px}.danger{color:#ffb7b7}.status{white-space:pre-wrap}@media(max-width:780px){.editor{grid-template-columns:1fr}.preview{position:static}}</style></head><body><div id="root"></div><script type="module" src="./studio.js"></script></body></html>
